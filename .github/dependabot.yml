version: 2
updates:
  # One monthly PR for npm minor and patch updates; major versions come as their own PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node must match the Node major we run (.nvmrc). Bump both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
